# 正式環境覆蓋設定:疊加在 docker-compose.yml 之上
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 與開發環境的差異:
#   - 資料庫、Redis 不對外開放埠口(只有容器內部網路可連;要連線請用 docker compose exec)
#   - Redis 啟用密碼(REDIS_PASSWORD)
#   - nginx 開 80/443 並掛載憑證目錄(./docker/certs/fullchain.pem、privkey.pem)
services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro

  db:
    ports: !reset []

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?請在 .env 設定 REDIS_PASSWORD}", "--appendonly", "yes"]
